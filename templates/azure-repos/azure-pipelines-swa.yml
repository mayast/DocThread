trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  VITE_GH_CLIENT_ID: ''
  VITE_AZURE_CLIENT_ID: 3a9dd418-f26a-4e43-b3bb-30a5c89b251a
  VITE_AZURE_TENANT_ID: 72f988bf-86f1-41af-91ab-2d7cd011db47
  VITE_GRAPH_TRANSPORT: msal
  VITE_ADO_TRANSPORT: off

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: 22.x
    displayName: Use Node.js 22

  - script: npm ci
    displayName: Install

  - script: npm test
    displayName: Test

  - script: npm run build
    displayName: Build
    env:
      VITE_BASE: /
      VITE_GH_CLIENT_ID: $(VITE_GH_CLIENT_ID)
      VITE_OAUTH_PROXY: /api
      VITE_AZURE_CLIENT_ID: $(VITE_AZURE_CLIENT_ID)
      VITE_AZURE_TENANT_ID: $(VITE_AZURE_TENANT_ID)
      VITE_GRAPH_TRANSPORT: $(VITE_GRAPH_TRANSPORT)
      VITE_ADO_TRANSPORT: $(VITE_ADO_TRANSPORT)

  - task: AzureStaticWebApp@0
    displayName: Deploy
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATICWEBAPP_DEPLOYMENT_TOKEN)
      app_location: dist
      api_location: api
      output_location: ''
      skip_app_build: true